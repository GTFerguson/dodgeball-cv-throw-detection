[project]
name = "dodgeball-throw-attempts"
version = "0.1.0"
description = "Throw attempts from broadcast dodgeball footage: an attributed timeline and team throw efficiency"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt (the pose runs on disk
# were produced with those exact builds); this file carries tooling only.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools/", ".venv/", "data/", "output/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E402: every script puts the repo on sys.path before importing src; the imports
# that follow carry the noqa where they occur.
# E501: line-length above is the target the code is written to, not a gate.
# Continuation lines are aligned by hand to the call they belong to, and a hard
# cap breaks that alignment on the handful of lines that run a few columns over.
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
